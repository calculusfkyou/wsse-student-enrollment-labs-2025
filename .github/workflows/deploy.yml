name: Deploy with CDK

on:
  push:
    branches:
      - "feature/lab06"

# 注意：我們不再需要 OIDC 的 permissions 區塊

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ★★ 關鍵修改 ★★
      # 從 GitHub Secrets 讀取憑證並設定 AWS 環境
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2 # 請根據您的區域修改

      - name: Install dependencies
        run: npm install

      - name: Install Lambda dependencies
        run: npm install @aws-sdk/client-dynamodb @aws-sdk/lib-dynamodb @aws-sdk/client-sns

      - name: Build project
        run: npm run build

      # ★ 手動編譯 Lambda 的步驟 ★
      - name: Build Lambda code
        run: npm run build:lambda

      - name: Deploy to AWS with CDK
        run: npx cdk deploy --require-approval never
